# Dependabot configuration for ANTARES project
# Monitors dependencies across all three components: Rust, Python, and Web
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust dependencies (antares simulator)
  - package-ecosystem: "cargo"
    directory: "/antares"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # Python dependencies (antares-python SDK)
  - package-ecosystem: "pip"
    directory: "/antares-python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # JavaScript/TypeScript dependencies (antares-web)
  - package-ecosystem: "npm"
    directory: "/antares-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    ignore:
      # Ignore major version updates for React (manual testing required)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
