name: Web CI

on:
  push:
    branches: [ main ]
    paths:
      - 'antares-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'antares-web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: antares-web/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./antares-web

    - name: Run tests
      run: npm test -- --run
      working-directory: ./antares-web

    - name: Generate coverage report
      run: npm run test:coverage -- --run
      working-directory: ./antares-web

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        directory: ./antares-web/coverage
        flags: web
        fail_ci_if_error: false
      continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: antares-web/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./antares-web

    - name: Run ESLint
      run: npm run lint
      working-directory: ./antares-web

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: antares-web/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./antares-web

    - name: Check TypeScript types
      run: npx tsc --noEmit
      working-directory: ./antares-web

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: antares-web/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./antares-web

    - name: Build application
      run: npm run build
      working-directory: ./antares-web

    - name: Check build output
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist directory not found"
          exit 1
        fi
        if [ ! -f "dist/index.html" ]; then
          echo "Error: dist/index.html not found"
          exit 1
        fi
        echo "Build successful!"
      working-directory: ./antares-web
